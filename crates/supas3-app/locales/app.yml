  en: Interrupted when supaS3 closed. Retry downloads it again from the start, to the same file; an existing file there is not replaced. A partial file named .supas3-…part may be left in that folder.
  zh-CN: supaS3 关闭时中断。点“重试”会从头重新下载到同一位置，不会替换那里已有的文件。该文件夹中可能留有名为 .supas3-…part 的不完整文件，需要手动删除。
