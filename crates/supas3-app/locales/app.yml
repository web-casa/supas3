  zh-CN: 该传输已在重试中。
retry.maybe_written:
  en: "%{name} was not retried: its target changed since it started, so the cut-off attempt may have written it. Check the target."
  zh-CN: "%{name} 未自动重试：目标在传输开始后已有变化，中断的那次可能已经写入。请核对目标。"
