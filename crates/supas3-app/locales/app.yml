  en: "Leave empty to use %{endpoint}"
  zh-CN: "留空则使用 %{endpoint}"
form.endpoint_from_region:
  en: Leave empty to use the service’s endpoint for the region
  zh-CN: 留空则使用该地域的默认端点
form.access_key:
  en: Access key ID
  zh-CN: Access Key ID
form.secret_key:
  en: Secret access key
  zh-CN: Secret Access Key
form.secret_keep:
  en: Leave empty to keep the saved key
  zh-CN: 留空则保留已保存的密钥
form.session_token:
  en: Session token
  zh-CN: 会话令牌
form.session_token_help:
  en: Only for temporary credentials. It is not renewed when it expires.
  zh-CN: 仅临时凭据需要填写，过期后不会自动续期。
form.session_token_keep:
  en: Leave empty to keep the saved token. It is replaced together with the secret key.
  zh-CN: 留空则保留已保存的令牌。更换 Secret Access Key 时令牌会一并替换。
form.credentials:
  en: Credentials
  zh-CN: 凭据
form.credentials_typed:
  en: Access keys entered here
  zh-CN: 在此输入访问密钥
form.credentials_profile:
  en: "AWS configuration: %{name}"
  zh-CN: "本机 AWS 配置：%{name}"
form.aws_config_help:
  en: Profiles of this computer’s AWS configuration (~/.aws). Their keys stay there and are read when connecting.
  zh-CN: 本机 AWS 配置（~/.aws）中的配置。密钥留在原处，连接时读取。
form.aws_config_missing:
  en: No AWS configuration was found on this computer (~/.aws/config or ~/.aws/credentials).
  zh-CN: 本机没有找到 AWS 配置（~/.aws/config 或 ~/.aws/credentials）。
form.aws_config_left_out:
  en: "Not offered: %{profiles}."
  zh-CN: "未列出：%{profiles}。"
form.aws_profile_gone:
  en: "The profile “%{name}” is no longer in this computer’s AWS configuration; connecting will fail."
  zh-CN: "本机 AWS 配置中已没有“%{name}”，连接会失败。"
form.aws_profile_unusable:
  en: "The profile “%{name}” now %{why}. Writes through it are checked first, which is not atomic; choose another profile or typed keys."
  zh-CN: "配置“%{name}”现在%{why}。经它写入时会先检查再写入，并非原子操作；请改选其他配置或输入访问密钥。"
form.aws_profile_left_out:
  en: "%{name} (%{why})"
  zh-CN: "%{name}（%{why}）"
form.list_separator:
  en: "; "
  zh-CN: "；"
form.aws_profile_sso:
  en: signs in with IAM Identity Center, which supaS3 does not support
  zh-CN: 使用 IAM Identity Center 登录，supaS3 不支持
form.aws_profile_endpoint:
  en: sends requests to another endpoint; add that service with its own settings instead
  zh-CN: 请求发往其他端点，请改为按该服务添加连接
form.bucket:
  en: Bucket
  zh-CN: 存储桶
form.bucket_help:
  en: Optional. Opens this bucket directly, for credentials that can’t list buckets.
  zh-CN: 可选。直接打开该存储桶，适用于无权列出存储桶的凭据。
form.test:
  en: Test connection
  zh-CN: 测试连接
form.testing:
  en: Testing…
  zh-CN: 正在测试…
form.test_passed:
  en: Connected
  zh-CN: 连接成功
form.test_failed:
  en: "Couldn’t connect. %{detail}"
  zh-CN: "连接失败。%{detail}"
form.save_failed:
  en: "Couldn’t save. %{detail}"
  zh-CN: "保存失败。%{detail}"

problem.name_missing:
  en: Enter a name for this connection.
  zh-CN: 请填写连接名称。
problem.region_missing:
  en: Enter the region of the bucket.
  zh-CN: 请填写存储桶所在的地域。
problem.endpoint_missing:
  en: Enter the service endpoint.
  zh-CN: 请填写服务端点。
problem.access_key_missing:
  en: Enter the access key ID.
  zh-CN: 请填写 Access Key ID。
problem.secret_key_missing:
  en: Enter the secret access key.
  zh-CN: 请填写 Secret Access Key。
problem.cos_bucket_appid:
  en: A COS bucket name ends with its APPID, such as photos-1250000000.
  zh-CN: COS 存储桶名称以 APPID 结尾，例如 photos-1250000000。
problem.oss_bucket_underscore:
  en: OSS can’t be reached through a bucket name that contains an underscore.
  zh-CN: 名称含下划线的存储桶无法通过 OSS 的访问方式连接。
problem.bucket_dot:
  en: A bucket name with a dot breaks the HTTPS certificate of this service.
  zh-CN: 名称含句点的存储桶会导致该服务的 HTTPS 证书校验失败。

