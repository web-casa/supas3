  en: Endpoint
  zh-CN: 端点
form.endpoint_default:
  en: "Leave empty to use %{endpoint}"
  zh-CN: "留空则使用 %{endpoint}"
form.endpoint_from_region:
  en: Leave empty to use the service’s endpoint for the region
  zh-CN: 留空则使用该地域的默认端点
form.access_key:
  en: Access key ID
  zh-CN: Access Key ID
form.secret_key:
  en: Secret access key
  zh-CN: Secret Access Key
form.secret_keep:
  en: Leave empty to keep the saved key
  zh-CN: 留空则保留已保存的密钥
form.session_token:
  en: Session token
  zh-CN: 会话令牌
form.session_token_help:
  en: Only for temporary credentials. It is not renewed when it expires.
  zh-CN: 仅临时凭据需要填写，过期后不会自动续期。
form.session_token_keep:
  en: Leave empty to keep the saved token. It is replaced together with the secret key.
  zh-CN: 留空则保留已保存的令牌。更换 Secret Access Key 时令牌会一并替换。
form.bucket:
  en: Bucket
  zh-CN: 存储桶
form.bucket_help:
  en: Optional. Opens this bucket directly, for credentials that can’t list buckets.
  zh-CN: 可选。直接打开该存储桶，适用于无权列出存储桶的凭据。
