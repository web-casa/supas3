  en: "%{name} was cut off by the network; retrying in %{seconds} s (attempt %{attempt} of %{of}). Remove it from the list to stop."
  zh-CN: "%{name} 因网络中断失败，将在 %{seconds} 秒后自动重试（第 %{attempt} 次，共 %{of} 次）。从列表中移除即可取消。"
retry.scheduled_many:
  en: "%{count} transfers were cut off by the network; retrying in about %{seconds} s. Remove one from the list to stop it."
  zh-CN: "%{count} 个传输因网络中断失败，约 %{seconds} 秒后自动重试。从列表中移除即可取消对应的重试。"
