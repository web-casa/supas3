  zh-CN: "另有 %{count} 个未列出"
sync.action_new:
  en: New
  zh-CN: 新增
sync.action_changed:
  en: Replace
  zh-CN: 替换
sync.action_unverified:
  en: Replace (unverified)
  zh-CN: 替换（无法比较）
sync.action_unchanged:
  en: Unchanged
  zh-CN: 无变化
sync.action_skipped:
  en: Skipped
  zh-CN: 跳过
sync.action_filtered:
  en: Filtered out
  zh-CN: 已过滤
sync.action_other:
  en: Other
  zh-CN: 其他
sync.agree_replace:
  en: "Replace %{count} objects in storage with the files from this computer"
  zh-CN: "用本机文件替换存储中的 %{count} 个对象"
sync.start:
  en: Start sync
  zh-CN: 开始同步
sync.started:
  en: "%{count} uploads added to transfers"
  zh-CN: "已将 %{count} 个上传加入传输"
sync.start_failed:
  en: "Couldn’t start the sync: %{detail}. Compare again."
  zh-CN: "无法开始同步：%{detail}。请重新比较。"
view.image_form_unsupported:
  en: This form of WebP image (animated or with extra data) isn’t shown here. Copy it to this computer to open it.
  zh-CN: 此类 WebP 图片（动画或带附加数据）不在这里显示。请复制到本机后打开。
sync.nothing_with_options:
  en: Nothing to upload with this option. Files already in storage were not compared and may differ.
  zh-CN: 按当前选项没有需要上传的文件。存储中已存在的文件未做比较，内容可能不同。
