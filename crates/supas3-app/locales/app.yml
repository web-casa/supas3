details.path:
  en: Path
  zh-CN: 路径
details.download:
  en: Download…
  zh-CN: 下载…
details.download_here:
  en: Download Here
  zh-CN: 下载到此处
storage.journal_failed:
  en: "The transfer list could not be saved (%{detail}). Transfers go on, but would not be listed after a restart. Check the free disk space."
  zh-CN: "无法保存传输列表（%{detail}）。传输会继续，但重启后不会再列出。请检查磁盘剩余空间。"
storage.saved_job_failed:
  en: "A saved job's result could not be written (%{detail}); that job will not run on its schedule again until supaS3 restarts."
  zh-CN: "无法写入已保存任务的结果（%{detail}）；在重启 supaS3 之前，该任务不会再按计划运行。"
versions.delete:
  en: Delete for good
  zh-CN: 永久删除
versions.delete_question:
  en: Delete this version for good? It cannot be brought back.
  zh-CN: 永久删除此版本？删除后无法恢复。
versions.delete_data_note:
  en: The object stays as it is now; only this older version goes.
  zh-CN: 对象当前内容不变，只删除这个旧版本。
versions.delete_marker_reappears:
  en: This delete marker is what hides the object now. Deleting it makes the object appear again, as its previous version.
  zh-CN: 当前正是这个删除标记让对象不可见。删除它后，对象会以上一个版本重新出现。
versions.delete_marker_current:
  en: This delete marker is the object's current state; there is no older data version loaded below it.
  zh-CN: 这个删除标记是对象当前的状态；下面没有已加载的旧数据版本。
versions.delete_marker_no_change:
  en: This delete marker is not the current one; deleting it does not change whether the object is visible.
  zh-CN: 这个删除标记不是当前版本；删除它不会改变对象当前是否可见。
versions.deleted:
  en: The version was deleted.
  zh-CN: 已删除该版本。
versions.download_queued:
  en: "Downloading the version as “%{name}”."
  zh-CN: "正在将该版本下载为“%{name}”。"
view.too_large_to_save:
  en: "The text is larger than %{limit} and is not saved; it could not be opened here again."
  zh-CN: "文本超过 %{limit}，未保存；超过此大小后在这里无法再次打开。"
leave.title:
  en: "Unsaved edits in %{count} open files"
  zh-CN: "%{count} 个打开的文件有未保存的修改"
leave.body:
  en: Save them before leaving, or discard the edits?
  zh-CN: 离开前保存它们，还是放弃这些修改？
leave.save_all:
  en: Save all
  zh-CN: 全部保存
leave.save_failed:
  en: Not everything could be saved, so nothing was closed. The edits are still open.
  zh-CN: 有文件未能保存，因此没有关闭任何内容；修改仍然打开着。
connection.unsaved_edits:
  en: Files of this connection have unsaved edits. Save or close them first.
  zh-CN: 此连接下有文件存在未保存的修改，请先保存或关闭它们。
versions.unsafe_name:
  en: "“%{name}” cannot be used as a file name on this computer, so this version was not downloaded."
  zh-CN: "“%{name}”不能用作本机的文件名，因此没有下载这个版本。"
resume.release_failed:
  en: "What this transfer kept could not be let go of yet; it stays listed until it can: %{error}. A rule in the bucket can also remove unfinished uploads after some days."
  zh-CN: "暂时无法释放该传输保留的数据，它会留在列表中直到可以释放：%{error}。也可以在存储桶上设置规则，几天后自动清除未完成的上传。"
tasks.pause:
  en: Pause
  zh-CN: 暂停
tasks.continue:
  en: Continue
  zh-CN: 继续
tasks.state_paused_at:
  en: "Paused at %{percent}%"
  zh-CN: "已暂停（%{percent}%）"
tasks.cannot_pause:
  en: This transfer can no longer be paused.
  zh-CN: 该传输已无法暂停。
tasks.cannot_continue:
  en: This transfer cannot go on from where it stopped; retry it to start again.
  zh-CN: 该传输无法从中断处继续，请重试以重新开始。
