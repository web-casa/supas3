  zh-CN: "“%{name}”在你选择替换之后又发生了变化，因此保留原样，未被替换。"
copy.check_failed:
  en: "Couldn’t check the target before copying; nothing was copied. %{detail}"
  zh-CN: "复制前无法检查目标位置，未复制任何内容。%{detail}"
