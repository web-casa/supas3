  en: "A folder in storage is renamed by moving each object in it, one by one. It is not done in one step: if it stops, part of the folder is under the new name and part under the old."
  zh-CN: "存储中的文件夹通过逐个移动其中的对象来重命名，不是一步完成：如果中途停止，一部分对象在新名称下，一部分仍在原名称下。"
