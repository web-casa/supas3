content_type.change:
  en: Change Content-Type…
  zh-CN: 修改内容类型…
content_type.too_large:
  en: Content-Type is changed here only for objects up to 5 GiB.
  zh-CN: 只能修改不超过 5 GiB 的对象的内容类型。
content_type.title:
  en: "Content-Type of %{name}"
  zh-CN: "%{name} 的内容类型"
content_type.suggested:
  en: "By its name:"
  zh-CN: 按文件名建议：
content_type.note:
  en: "The object is copied onto itself with the new type; its modified time changes. Nothing is changed if its content changed since it was shown."
  zh-CN: "对象会以新类型复制到原位置，修改时间随之更新。对象内容在显示之后被改动过时不做修改。"
properties.too_large:
  en: The type and metadata are changed here only for objects up to 5 GiB.
  zh-CN: 只能修改不超过 5 GiB 的对象的内容类型与元数据。
properties.archived:
  en: An archived object must be restored before its type or metadata can be changed.
  zh-CN: 归档存储的对象需要先解冻，才能修改内容类型或元数据。
content_type.changed:
  en: The object’s content changed since it was shown. Nothing was changed; look at it again and retry.
  zh-CN: 对象内容在显示之后已被改动，未做修改。请重新查看后再试。
content_type.unchanged:
  en: This is already the object’s Content-Type.
  zh-CN: 对象已经是这个内容类型。
content_type.save:
  en: Change
  zh-CN: 修改
metadata.edit:
  en: Edit metadata…
  zh-CN: 编辑元数据…
metadata.title:
  en: "Metadata of %{name}"
  zh-CN: "%{name} 的元数据"
metadata.key:
  en: Name
  zh-CN: 名称
metadata.value:
  en: Value
  zh-CN: 值
metadata.add:
  en: Add
  zh-CN: 添加
metadata.remove:
  en: Remove
  zh-CN: 移除
metadata.fixed:
  en: "%{key}: %{value} (kept as it is)"
  zh-CN: "%{key}：%{value}（保持不变）"
metadata.note:
  en: "Names: letters, digits and hyphens. Values: ASCII only. Entries left as they are stay as they are. Saving updates the modified time; nothing is changed if the object changed since it was shown."
  zh-CN: "名称只能用字母、数字和连字符，值只能用 ASCII 字符；未改动的条目保持原样。保存会更新修改时间；对象在显示之后被改动过时不做修改。"
metadata.key_invalid:
  en: A name may use letters, digits and hyphens only.
  zh-CN: 名称只能使用字母、数字和连字符。
metadata.key_duplicate:
  en: Each name may be used once (names do not differ by case).
  zh-CN: 每个名称只能出现一次（不区分大小写）。
metadata.key_fixed:
  en: This name is kept by supaS3 or the service and cannot be set here.
  zh-CN: 此名称由 supaS3 或服务保留，不能在这里设置。
metadata.value_invalid:
  en: A new or changed value may use printable ASCII characters only.
  zh-CN: 新增或修改的值只能使用 ASCII 可打印字符。
metadata.too_large:
  en: Metadata is limited to 2 KiB of names and values together.
  zh-CN: 元数据的名称与值合计不能超过 2 KiB。
metadata.unchanged:
  en: Nothing was changed.
  zh-CN: 没有改动。
metadata.changed:
  en: The object’s content or properties changed since they were shown. Nothing was changed; look at it again and retry.
  zh-CN: 对象内容或属性在显示之后已被改动，未做修改。请重新查看后再试。

folder_access.make_private:
  en: Make everything in it private…
  zh-CN: 将其中对象设为私有…
folder_access.make_public:
  en: Make everything in it public…
  zh-CN: 将其中对象设为公开读取…
folder_access.private_title:
  en: Make every object in this folder private?
  zh-CN: 将此文件夹中的所有对象设为私有？
folder_access.public_title:
  en: Make every object in this folder public?
  zh-CN: 将此文件夹中的所有对象设为公开读取？
folder_access.count:
  en: "%{count} objects, in this folder and the folders inside it, are changed one by one. This is not done all at once: if it stops, some are changed and some are not; the task list says how many."
  zh-CN: "此文件夹及其子文件夹中的 %{count} 个对象会逐个修改，不是一次完成：中途停止时会有部分已改、部分未改，任务列表会显示数量。"
folder_access.replaced:
  en: Each object’s current grants are replaced, including ones given to particular accounts.
  zh-CN: 每个对象当前的授权都会被替换，包括授予特定账户的授权。
folder_access.empty:
  en: This folder holds no objects.
  zh-CN: 此文件夹中没有对象。
folder_access.too_many:
  en: "This folder holds %{count} objects; access is changed here for at most %{limit} at a time."
  zh-CN: "此文件夹中有 %{count} 个对象，这里一次最多修改 %{limit} 个。"
folder_access.started:
  en: Changing access; the task list shows progress.
  zh-CN: 正在修改访问权限，进度见任务列表。
folder_access.summary:
  en: "%{changed} changed, %{failed} failed, %{left} not reached. First error: %{error}"
  zh-CN: "已修改 %{changed} 个，失败 %{failed} 个，未处理 %{left} 个。首个错误：%{error}"
folder_access.stopped:
  en: "Stopped because the connection was edited: %{changed} changed, %{failed} failed, %{left} not reached."
  zh-CN: "连接已被修改，已停止：已修改 %{changed} 个，失败 %{failed} 个，未处理 %{left} 个。"
import.button:
  en: Import from web addresses…
  zh-CN: 从网址导入…
import.title:
  en: "Import from web addresses"
  zh-CN: "从网址导入"
import.into:
  en: "Into %{place}"
  zh-CN: "导入到 %{place}"
import.placeholder:
  en: One web address a line, http or https
  zh-CN: 每行一个网址（http 或 https）
import.ready:
  en: "%{count} ready to import."
  zh-CN: "%{count} 个可以导入。"
import.not_web:
  en: not an http or https address
  zh-CN: 不是 http 或 https 网址
import.no_name:
  en: the address names no file to call the object
  zh-CN: 网址中没有可作为对象名的文件名
import.credentials:
  en: a user name or password in the address is not supported
  zh-CN: 不支持网址中带用户名或密码
import.duplicate:
  en: another line gives the same name
  zh-CN: 与其他行的对象名重复
import.limit:
  en: Largest file
  zh-CN: 单个文件上限
import.limit_invalid:
  en: Enter a size limit from 1 to 5,242,880 MiB.
  zh-CN: 请输入 1 到 5242880 之间的大小上限（MiB）。
import.fix_lines:
  en: Correct or remove the lines marked in red first.
  zh-CN: 请先修改或删除标红的行。
import.none:
  en: Enter at least one web address.
  zh-CN: 请至少输入一个网址。
import.too_many:
  en: "Import at most %{limit} addresses at a time."
  zh-CN: "一次最多导入 %{limit} 个网址。"
import.note:
  en: "Files are downloaded to this computer first, then uploaded; make sure there is room. Existing objects are never replaced. Private network addresses are refused."
  zh-CN: "文件先下载到本机再上传，请确保空间足够。不会替换已存在的对象。内网地址会被拒绝。"
import.start:
  en: Import
  zh-CN: 导入
import.queued:
  en: "%{count} imports added; the task list shows progress."
  zh-CN: "已添加 %{count} 个导入任务，进度见任务列表。"

bucket.new_ellipsis:
  en: New bucket…
  zh-CN: 新建存储桶…
bucket.new_title:
  en: New bucket
  zh-CN: 新建存储桶
bucket.name:
  en: Name
  zh-CN: 名称
bucket.region:
  en: Region
  zh-CN: 地域
bucket.region_fixed:
  en: The bucket is made in the connection’s region; another region needs a connection to it.
  zh-CN: 存储桶建在连接所在的地域；其他地域需要另建对应的连接。
bucket.region_missing:
  en: Enter a region.
  zh-CN: 请输入地域。
bucket.rule:
  en: 3 to 63 lower-case letters, digits and hyphens, starting and ending with a letter or digit. Names are unique within the service or account.
  zh-CN: 3 到 63 个小写字母、数字或连字符，以字母或数字开头和结尾。名称在服务或账户内唯一。
bucket.rule_dots:
  en: 3 to 63 lower-case letters, digits, hyphens and dots, starting and ending with a letter or digit. On Amazon S3 names are unique across all accounts.
  zh-CN: 3 到 63 个小写字母、数字、连字符或点，以字母或数字开头和结尾。Amazon S3 上的名称在所有账户间唯一。
bucket.rule_cos:
  en: Lower-case letters, digits and hyphens, ending with -APPID (for example photos-1250000000); the whole host name is at most 60 characters.
  zh-CN: 小写字母、数字或连字符，以 -APPID 结尾（例如 photos-1250000000）；完整访问域名不超过 60 个字符。
bucket.name_form:
  en: Use 3 to 63 lower-case letters, digits and hyphens, starting and ending with a letter or digit.
  zh-CN: 请使用 3 到 63 个小写字母、数字或连字符，并以字母或数字开头和结尾。
bucket.name_dot:
  en: This service does not allow dots in bucket names.
  zh-CN: 此服务的存储桶名称不能含点。
bucket.name_app_id:
  en: COS bucket names end with -APPID, for example photos-1250000000.
  zh-CN: COS 存储桶名称须以 -APPID 结尾，例如 photos-1250000000。
bucket.name_cos_long:
  en: The name is too long for this region; COS host names are at most 60 characters.
  zh-CN: 对此地域而言名称过长：COS 访问域名不超过 60 个字符。
bucket.create:
  en: Create
  zh-CN: 新建
bucket.created:
  en: "Bucket %{name} was created."
  zh-CN: "已新建存储桶 %{name}。"
bucket.delete_ellipsis:
  en: Delete bucket…
  zh-CN: 删除存储桶…
bucket.delete_title:
  en: "Delete bucket %{name}?"
  zh-CN: "删除存储桶 %{name}？"
bucket.delete_body:
  en: Only an empty bucket can be deleted, with no objects, old versions, delete markers or unfinished multipart uploads left. Deleting cannot be undone, and the name may be taken by someone else afterwards.
  zh-CN: 只能删除空的存储桶：不能有对象、历史版本、删除标记或未完成的分片上传。删除无法撤销，之后该名称可能被他人占用。
bucket.delete_type:
  en: "Type %{name} to confirm."
  zh-CN: "请输入 %{name} 以确认。"
bucket.delete:
  en: Delete bucket
  zh-CN: 删除存储桶
bucket.delete_unsaved:
  en: An object of this bucket has unsaved edits; save or close it first.
  zh-CN: 此存储桶中有对象存在未保存的修改，请先保存或关闭。
bucket.delete_busy:
  en: Transfers are still working in this bucket; wait for them or cancel them first.
  zh-CN: 仍有传输在使用此存储桶，请等待完成或先取消。
bucket.not_empty:
  en: The bucket is not empty. Delete its objects first, including old versions and delete markers; unfinished multipart uploads also keep it from being deleted.
  zh-CN: 存储桶不为空。请先删除其中的对象，包括历史版本与删除标记；未完成的分片上传也会阻止删除。
bucket.deleted:
  en: "Bucket %{name} was deleted."
  zh-CN: "已删除存储桶 %{name}。"
bucket.deleted_default:
  en: "Bucket %{name} was deleted. It was the bucket this connection opens; edit the connection to choose another."
  zh-CN: "已删除存储桶 %{name}。它是此连接默认打开的存储桶，请编辑连接另选一个。"
bucket.versioning:
  en: Versioning
  zh-CN: 版本控制
bucket.versioning_off:
  en: Never turned on.
  zh-CN: 未开启。
bucket.versioning_enabled:
  en: "On: every change and deletion keeps the earlier version."
  zh-CN: 已开启：每次修改和删除都会保留之前的版本。
bucket.versioning_suspended:
  en: "Paused: versions kept so far stay; new changes keep none."
  zh-CN: 已暂停：已有的版本保留，新的修改不再保留版本。
bucket.versioning_unavailable:
  en: Not available here (the service does not offer it, or these credentials may not use it).
  zh-CN: 此处不可用（服务不支持，或当前凭据无权使用）。
bucket.versioning_enable:
  en: Turn on versioning
  zh-CN: 开启版本控制
bucket.versioning_suspend:
  en: Pause versioning
  zh-CN: 暂停版本控制
bucket.versioning_enable_title:
  en: "Turn on versioning for %{name}?"
  zh-CN: "为 %{name} 开启版本控制？"
bucket.versioning_enable_body:
  en: Every change and deletion will keep the earlier version, and old versions are stored and billed until they are deleted. Once on, versioning can be paused but never turned off again.
  zh-CN: 之后每次修改和删除都会保留之前的版本，旧版本会占用存储并计费，直到删除。开启后只能暂停，不能再关闭。
bucket.versioning_suspend_title:
  en: "Pause versioning for %{name}?"
  zh-CN: "暂停 %{name} 的版本控制？"
bucket.versioning_suspend_body:
  en: Versions kept so far stay and can still be restored; new changes will replace objects without keeping the earlier version.
  zh-CN: 已有的版本保留，仍可恢复；之后的修改会直接替换对象，不再保留之前的版本。
bucket.versioning_failed:
  en: "Versioning could not be changed: %{detail}"
  zh-CN: "无法修改版本控制：%{detail}"
bucket.policy_ellipsis:
  en: Bucket policy…
  zh-CN: 存储桶策略…
policy.title:
  en: "Policy of %{name}"
  zh-CN: "%{name} 的存储桶策略"
policy.unreadable:
  en: "The policy could not be read (the service may not offer it, or these credentials may not use it): %{detail}"
  zh-CN: "无法读取策略（服务可能不支持，或当前凭据无权使用）：%{detail}"
policy.saved:
  en: The bucket policy was saved.
  zh-CN: 存储桶策略已保存。
policy.note:
  en: Saving replaces the whole policy; an empty text removes it. A policy can make a bucket public or lock out even its owner, so check it first. Tencent COS names principals differently from AWS (qcs::cam::…).
  zh-CN: 保存会整份替换策略；内容为空表示删除策略。策略可能让存储桶公开，甚至把所有者也挡在外面，请先确认。腾讯云 COS 的主体写法与 AWS 不同（qcs::cam::…）。
policy.not_object:
  en: A bucket policy is a JSON object.
  zh-CN: 存储桶策略须是一个 JSON 对象。
policy.invalid:
  en: "This is not valid JSON: %{detail}"
  zh-CN: "不是有效的 JSON：%{detail}"
policy.unchanged:
  en: The policy is unchanged.
  zh-CN: 策略没有改动。

access.title:
  en: Access
  zh-CN: 访问权限
access.private:
  en: "Private: the object’s ACL grants no one else access. The bucket’s permissions or policy may still let others read it."
  zh-CN: 私有：对象 ACL 未授权给其他人。存储桶的权限或策略仍可能允许他人读取。
access.public_read:
  en: "Public read: anyone may read it."
  zh-CN: 公开读取：任何人都可以读取。
access.custom:
  en: Custom grants, other than private or public read.
  zh-CN: 自定义授权（既不是私有，也不是公开读取）。
access.unsupported:
  en: This service does not support object ACLs.
  zh-CN: 此服务不支持对象 ACL。
access.denied:
  en: These credentials may not read this object’s ACL.
  zh-CN: 当前凭据无权读取此对象的 ACL。
access.unknown:
  en: The object’s ACL could not be read.
  zh-CN: 无法读取此对象的 ACL。
access.read_only:
  en: IDrive e2 refuses changes to object ACLs, so they are only shown here.
  zh-CN: IDrive e2 不接受修改对象 ACL，这里只显示。
access.make_private:
  en: Make private
  zh-CN: 设为私有
access.make_public:
  en: Make public
  zh-CN: 设为公开读取
access.public_title:
  en: "Make “%{name}” public?"
  zh-CN: "将“%{name}”设为公开读取？"
access.private_title:
  en: "Make “%{name}” private?"
  zh-CN: "将“%{name}”设为私有？"
access.public_body:
  en: Anyone with its address will be able to read it, without credentials. Some buckets, for example ones that block public access, refuse or ignore this.
  zh-CN: 任何知道地址的人都可以不带凭据读取它。部分存储桶（例如开启了阻止公共访问的）会拒绝或忽略此设置。
access.private_body:
  en: The object’s ACL will grant no one but the owner; grants to others go. The bucket’s permissions or policy are not changed and may still let others read it.
  zh-CN: 对象 ACL 将只授权给所有者，授予他人的权限会被移除。存储桶的权限或策略不变，仍可能允许他人读取。
access.custom_replaced:
  en: Its current grants are replaced, including ones given to particular accounts.
  zh-CN: 当前的授权会被全部替换，包括授予特定账户的授权。
access.inherit_note:
  en: An object that follows its bucket’s permissions (the default on Alibaba Cloud OSS) cannot be set back to that here.
  zh-CN: 原来跟随存储桶权限的对象（阿里云 OSS 的默认值）修改后不能在这里改回跟随。
access.changed_meanwhile:
  en: Its access was changed by someone else meanwhile; nothing was changed. The panel shows it now.
  zh-CN: 访问权限已被他人修改，未做更改。详情面板已显示最新状态。
access.object_changed:
  en: Its content changed since it was shown; nothing was changed. Look at it again first.
  zh-CN: 对象内容在显示之后已被改动，未做更改。请先重新查看。
access.failed:
  en: "The access could not be changed: %{detail}"
  zh-CN: "无法修改访问权限：%{detail}"

