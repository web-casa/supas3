  zh-CN: "另有 %{count} 个"
conflict.replace_note:
  en: Replace checks just before writing that each one is still what was found now. That check is not atomic on this service, so a change made in the moment between can be overwritten. Folders are never replaced.
  zh-CN: 替换会在写入前确认每一项仍是现在看到的样子。在此服务上这一检查不是原子的，恰好在其间发生的修改可能被覆盖。文件夹不会被替换。
conflict.replace_note_atomic:
  en: Replace only goes ahead for items that are still what was found now; the service enforces this. Folders are never replaced.
  zh-CN: 只有仍是现在看到的样子的项目才会被替换，由服务端保证。文件夹不会被替换。
