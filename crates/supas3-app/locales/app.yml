  en: Cancelled
  zh-CN: 已取消
tasks.state_failed:
  en: "Failed: %{error}"
  zh-CN: "失败：%{error}"
copy.unsafe_local_name:
  en: An object’s name can’t be used as a file name on this computer, so it isn’t downloaded. Names with slashes, backslashes, colons or a trailing dot or space are refused.
  zh-CN: 有对象的名称不能用作此电脑上的文件名，因此不会下载。含斜杠、反斜杠、冒号，或以句点、空格结尾的名称会被拒绝。
copy.maybe_partial:
  en: Some items may already have been copied.
  zh-CN: 部分内容可能已经复制。
