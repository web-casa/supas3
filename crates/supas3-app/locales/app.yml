  en: Not yet tested against this service. It follows the provider’s documentation and may not work.
  zh-CN: 尚未在该服务上实测，按厂商文档实现，可能无法正常工作。
form.name:
  en: Name
  zh-CN: 名称
form.region:
  en: Region
  zh-CN: 地域
