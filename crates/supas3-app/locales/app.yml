copy.nothing_selected:
  en: Select something to copy first.
  zh-CN: 请先选择要复制的内容。
copy.local_to_local:
  en: Both sides show folders on this computer. Open a storage location on one side to copy.
  zh-CN: 两侧都是此电脑上的文件夹。请在一侧打开存储位置后再复制。
copy.target_is_bucket_list:
  en: Open a bucket on the other side first; items can’t be copied into a list of buckets.
  zh-CN: 请先在另一侧打开一个存储桶，无法复制到存储桶列表中。
copy.buckets_selected:
  en: Buckets can’t be copied. Open one and select what is inside.
  zh-CN: 无法复制存储桶本身，请打开后选择其中的内容。
copy.same_place:
  en: The other side shows the same location, so there is nothing to copy.
  zh-CN: 另一侧是同一个位置，无需复制。
copy.into_itself:
  en: A folder can’t be copied into itself.
  zh-CN: 无法将文件夹复制到它自身之内。
copy.unnamed_item:
  en: An item without a name can’t be copied from here.
  zh-CN: 无法从这里复制没有名称的项目。
copy.across_title:
  en: "Copy %{count} items to “%{target}”?"
  zh-CN: "将 %{count} 项复制到“%{target}”？"
copy.across_body:
  en: "From “%{source}”. These are two connections, so the data is downloaded to a temporary file on this computer and uploaded from there. It uses this computer’s network and disk space, and supaS3 must stay open until it finishes."
  zh-CN: "来源：“%{source}”。这是两个不同的连接，数据会先下载到此电脑的临时文件，再从这里上传。期间占用此电脑的网络和磁盘空间，完成前请保持 supaS3 运行。"
copy.queued:
  en: "%{count} transfers queued"
  zh-CN: "已加入 %{count} 个传输任务"
copy.copied:
  en: "%{count} items copied"
  zh-CN: "已复制 %{count} 项"
copy.some_failed:
  en: "%{count} items couldn’t be copied. %{detail}"
  zh-CN: "%{count} 项无法复制。%{detail}"
copy.failed:
  en: "Couldn’t copy. %{detail}"
  zh-CN: "复制失败。%{detail}"

delete.nothing_selected:
  en: Select something to delete first.
  zh-CN: 请先选择要删除的内容。
delete.local_files:
  en: Files on this computer aren’t deleted from supaS3. Use your file manager.
  zh-CN: supaS3 不删除此电脑上的文件，请使用系统的文件管理器。
delete.buckets:
  en: Buckets aren’t deleted from supaS3.
  zh-CN: supaS3 不删除存储桶。
delete.title_one:
  en: "Delete “%{name}”?"
  zh-CN: "删除“%{name}”？"
delete.title_many:
  en: "Delete %{count} items?"
  zh-CN: "删除 %{count} 项？"
delete.body:
  en: "From “%{location}”. Folders are deleted with everything in them. This can’t be undone."
  zh-CN: "位置：“%{location}”。文件夹会连同其中所有内容一并删除，此操作无法撤销。"
delete.done:
  en: "%{count} objects deleted"
  zh-CN: "已删除 %{count} 个对象"
delete.failed:
  en: "Couldn’t delete. %{detail}"
  zh-CN: "删除失败。%{detail}"

