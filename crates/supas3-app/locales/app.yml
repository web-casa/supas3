  en: Each item is copied first. Its original is removed only after the copy has been checked; files on this computer go to the recycle bin. Anything that cannot be checked keeps its original.
  zh-CN: 每一项先复制，复制结果校验通过后才删除原件；本机文件会移到回收站。无法校验的项保留原件。
