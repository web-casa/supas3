  zh-CN: "无法移到回收站，没有任何内容被永久删除。%{detail}"
copy.local_exists:
  en: "“%{path}” already exists; nothing there was replaced. The copy stopped there."
  zh-CN: "“%{path}”已存在，未被替换。复制在此处停止。"
