  en: "Stopped at “%{key}”: %{error}. %{moved} objects were moved, %{left} were not. The object it stopped at may now be under both names."
  zh-CN: "在“%{key}”处停止：%{error}。已移动 %{moved} 个对象，%{left} 个未处理。停止时的那个对象可能新旧名称下都存在。"
