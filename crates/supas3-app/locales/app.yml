tasks.cancel_all:
  en: Cancel all
  zh-CN: 全部取消
tasks.cannot_retry:
  en: This transfer can’t be retried after a restart. Start it again from the file list.
  zh-CN: 重启后无法重试该传输，请从文件列表重新发起。
tasks.remove:
  en: Remove
  zh-CN: 移除
