[package]
name = "supas3-core"
version = "0.1.0"
description = "Storage and transfer backend for supaS3, derived from Brows3"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1", features = ["full"] }

# AWS SDK
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "credentials-process", "rt-tokio", "rustls", "sso"] }
aws-sdk-s3 = "1"
aws-credential-types = "1"
aws-types = "1"
aws-smithy-types = { version = "1", features = ["rt-tokio", "http-body-1-x"] }
http-body = "1"

# Secure credential storage. Linux defaults to the persistent freedesktop
# Secret Service; keyutils remains available only to migrate legacy entries.
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native", "sync-secret-service", "crypto-rust", "vendored"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
log = "0.4"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
urlencoding = "2.1.3"
walkdir = "2.5.0"
glob = "=0.3.3"
futures = "0.3"
mime = "0.3"
mime_guess = "2"
cap-std = "4.0.3"
tempfile = "3.24"
sha2 = "0.10.9"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
url = "2"
md-5 = "0.10.6"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
winx = "0.36.4"
