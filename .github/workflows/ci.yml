name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
            binary: supas3
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: supas3.exe
          - name: Windows arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: supas3.exe
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: supas3
          - name: Linux arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: supas3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ clang libfontconfig-dev libwayland-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libdbus-1-dev pkg-config \
            libvulkan1 mesa-vulkan-drivers xvfb x11-utils imagemagick

      # rust-toolchain.toml selects the compiler; rustup installs it on first use.
      - name: Show toolchain
        run: rustc --version --verbose

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Check formatting
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release
        run: cargo build --release --locked -p supas3-app

      # Runs the real binary on a virtual display and waits until its window
      # exists and has drawn content, which a process that hangs during
      # startup or fails to render would never do.
      - name: Launch check (Linux)
        if: runner.os == 'Linux'
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
        run: |
          test -f "$VK_ICD_FILENAMES"
          xvfb-run -a -s "-screen 0 1280x800x24" bash -c '
            target/release/supas3 &
            pid=$!
            for attempt in $(seq 1 30); do
              if ! kill -0 "$pid" 2>/dev/null; then
                echo "the app exited before its window appeared" >&2; exit 1
              fi
              if xwininfo -root -tree | grep -q "\"supaS3\""; then
                # A window can exist before anything is drawn in it. Wait for
                # a frame with content: a blank screen has a single colour.
                for frame in $(seq 1 30); do
                  import -window root launch.png
                  colors=$(identify -format "%k" launch.png)
                  if [ "$colors" -gt 8 ]; then
                    kill "$pid"; wait "$pid" 2>/dev/null || true
                    echo "window appeared after ${attempt}s, rendered after ${frame} more ($colors colours)"
                    exit 0
                  fi
                  sleep 1
                done
                echo "the window stayed blank for 30s ($colors colours)" >&2
                kill "$pid"; exit 1
              fi
              sleep 1
            done
            echo "no supaS3 window within 30s" >&2
            kill "$pid"; exit 1
          '

      - name: Upload launch screenshot
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launch-screenshot-${{ matrix.target }}
          path: launch.png
          if-no-files-found: warn
          retention-days: 14

      # Hosted macOS and Windows runners have no guaranteed GPU, so a failure
      # here is reported without failing the build. These two only show that
      # the process stays alive; the window itself is confirmed by hand.
      - name: Launch check (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          target/release/supas3 &
          pid=$!
          sleep 15
          kill -0 "$pid" || { echo "the app exited within 15s" >&2; exit 1; }
          kill "$pid"

      - name: Launch check (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $process = Start-Process -FilePath target/release/supas3.exe -PassThru
          Start-Sleep -Seconds 15
          if ($process.HasExited) { throw "the app exited within 15s with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supas3-${{ matrix.target }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14
