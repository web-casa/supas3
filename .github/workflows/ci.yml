name: CI

on:
  push:
    branches: [main]
    # A version tag builds the same packages and drafts a release from them.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Collects the license of every library linked into the binaries. It fails
  # when a dependency carries a license that about.toml does not accept.
  licenses:
    name: Third-party licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: licenses
          cache-bin: true

      - name: Install cargo-about
        run: command -v cargo-about || cargo install --locked --features cli cargo-about@0.9.0

      - name: Generate the license list
        run: |
          cargo about generate --locked -m crates/supas3-app/Cargo.toml \
            packaging/licenses.hbs > THIRD_PARTY_LICENSES.txt
          test "$(wc -c < THIRD_PARTY_LICENSES.txt)" -gt 100000
          head -30 THIRD_PARTY_LICENSES.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.txt
          if-no-files-found: error
          retention-days: 14

  build:
    name: ${{ matrix.name }}
    needs: licenses
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
            binary: supas3
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: supas3.exe
          - name: Windows arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: supas3.exe
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: supas3
          - name: Linux arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: supas3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ clang libfontconfig-dev libwayland-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libdbus-1-dev pkg-config \
            libvulkan1 mesa-vulkan-drivers xvfb x11-utils imagemagick

      # rust-toolchain.toml selects the compiler; rustup installs it on first use.
      - name: Show toolchain
        run: rustc --version --verbose

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Check formatting
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release
        run: cargo build --release --locked -p supas3-app

      # Runs the real binary on a virtual display and waits until its window
      # exists and has drawn content, which a process that hangs during
      # startup or fails to render would never do.
      - name: Launch check (Linux)
        if: runner.os == 'Linux'
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
        run: |
          test -f "$VK_ICD_FILENAMES"
          xvfb-run -a -s "-screen 0 1280x800x24" bash -c '
            # The app closes its own window five seconds after it opens; it
            # must then end by itself, the way it does when a person closes it.
            SUPAS3_EXIT_AFTER_LAUNCH=close target/release/supas3 &
            pid=$!
            for attempt in $(seq 1 30); do
              if ! kill -0 "$pid" 2>/dev/null; then
                echo "the app exited before its window appeared" >&2; exit 1
              fi
              if xwininfo -root -tree | grep -q "\"supaS3\""; then
                # A window can exist before anything is drawn in it. Wait for
                # a frame with content: a blank screen has a single colour.
                for frame in $(seq 1 30); do
                  import -window root launch.png
                  colors=$(identify -format "%k" launch.png)
                  if [ "$colors" -gt 8 ]; then
                    echo "window appeared after ${attempt}s, rendered after ${frame} more ($colors colours)"
                    for wait_s in $(seq 1 40); do
                      if ! kill -0 "$pid" 2>/dev/null; then
                        wait "$pid"; status=$?
                        echo "the app ended ${wait_s}s later with status $status"
                        exit "$status"
                      fi
                      sleep 1
                    done
                    echo "the app did not end after closing its window" >&2
                    kill "$pid"; exit 1
                  fi
                  sleep 1
                done
                echo "the window stayed blank for 30s ($colors colours)" >&2
                kill "$pid"; exit 1
              fi
              sleep 1
            done
            echo "no supaS3 window within 30s" >&2
            kill "$pid"; exit 1
          '

      - name: Upload launch screenshot
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launch-screenshot-${{ matrix.target }}
          path: launch.png
          if-no-files-found: warn
          retention-days: 14

      # On macOS and Windows the window cannot be inspected here. These check
      # that the main window drew a frame (the app writes SUPAS3_LAUNCH_REPORT
      # after its first one), that the app quits by itself after five
      # seconds, and that it then ends cleanly within 40 seconds. What the
      # window looks like is confirmed by hand.
      - name: Launch check (macOS)
        if: runner.os == 'macOS'
        env:
          SUPAS3_EXIT_AFTER_LAUNCH: quit
        run: |
          export SUPAS3_LAUNCH_REPORT=$RUNNER_TEMP/launch-report
          target/release/supas3 &
          pid=$!
          sleep 4
          kill -0 "$pid" || { echo "the app ended before it could quit by itself" >&2; exit 1; }
          for second in $(seq 1 40); do
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid"; status=$?
              echo "the app ended with status $status"
              test -f "$SUPAS3_LAUNCH_REPORT" || { echo "the window never drew a frame" >&2; exit 1; }
              exit "$status"
            fi
            sleep 1
          done
          echo "the app did not end after quitting" >&2
          kill "$pid"; exit 1

      - name: Launch check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SUPAS3_EXIT_AFTER_LAUNCH: quit
        run: |
          $env:SUPAS3_LAUNCH_REPORT = Join-Path $env:RUNNER_TEMP 'launch-report'
          $process = Start-Process -FilePath target/release/supas3.exe -PassThru
          Start-Sleep -Seconds 4
          if ($process.HasExited) { throw "the app ended before it could quit by itself, code $($process.ExitCode)" }
          if (-not $process.WaitForExit(40000)) {
            Stop-Process -Id $process.Id -Force
            throw "the app did not end after quitting"
          }
          Write-Host "the app ended with code $($process.ExitCode)"
          if ($process.ExitCode -ne 0) { throw "the app ended with code $($process.ExitCode)" }
          if (-not (Test-Path $env:SUPAS3_LAUNCH_REPORT)) { throw "the window never drew a frame" }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-licenses

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends rpm
          packaging/linux/package.sh target/release/supas3 THIRD_PARTY_LICENSES.txt dist
          # The package must install with its declared dependencies and put
          # the program on the path.
          sudo apt-get install -y --no-install-recommends ./dist/*.deb
          test -x /usr/bin/supas3
          test -f /usr/share/doc/supas3/THIRD_PARTY_LICENSES.txt
          grep -q 'Lucide Icons and Contributors' /usr/share/doc/supas3/LICENSES/Lucide-ISC.txt
          # The RPM installs on Fedora with the dependencies it declares.
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:42 sh -euc \
            'dnf install -y -q --setopt=install_weak_deps=False /dist/*.rpm; test -x /usr/bin/supas3; test -f /usr/share/doc/supas3/THIRD_PARTY_LICENSES.txt'
          # The AppImage holds the program, its launcher and the licenses.
          (mkdir -p appimage-check && cd appimage-check \
            && APPIMAGE_EXTRACT_AND_RUN=1 ../dist/*.AppImage --appimage-extract > /dev/null \
            && test -x squashfs-root/AppRun && test -x squashfs-root/usr/bin/supas3 \
            && test -f squashfs-root/usr/share/doc/supas3/THIRD_PARTY_LICENSES.txt)

      # With a Developer ID certificate in the repository's secrets the app
      # is signed with it, and a version tag is also notarized. Without one
      # (forks, pull requests) the package is signed ad hoc as before.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            keychain=$RUNNER_TEMP/signing.keychain-db
            keychain_password=$(uuidgen)
            printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 3600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
              -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            rm "$RUNNER_TEMP/certificate.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            MACOS_SIGN_IDENTITY=$(security find-identity -v -p codesigning "$keychain" \
              | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)
            test -n "$MACOS_SIGN_IDENTITY" || { echo "the certificate holds no Developer ID Application identity" >&2; exit 1; }
            export MACOS_SIGN_IDENTITY
            if [ "$IS_TAG" = true ] && [ -n "$APPLE_PASSWORD" ]; then export MACOS_NOTARIZE=1; fi
          else
            echo "No signing certificate is configured; the package is signed ad hoc."
          fi
          packaging/macos/package.sh target/release/supas3 THIRD_PARTY_LICENSES.txt dist
          if [ -n "$APPLE_CERTIFICATE" ]; then security delete-keychain "$keychain"; fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # package.ps1 needs 6.5 or later and checks the version; this
          # installs Inno Setup or upgrades it, and does nothing when the
          # latest is already there.
          choco upgrade innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "could not install Inno Setup" }
          $arch = if ('${{ matrix.target }}' -like 'aarch64-*') { 'arm64' } else { 'x64' }
          packaging/windows/package.ps1 -Binary target/release/supas3.exe `
            -Licenses THIRD_PARTY_LICENSES.txt -Arch $arch -Out dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supas3-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # On a version tag: gathers the packages of all five platforms into a draft
  # release. A person reviews the draft and publishes it.
  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: supas3-*
          path: dist
          merge-multiple: true

      - name: Check the tag against the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/supas3-app/Cargo.toml | head -1)
          test "$TAG" = "v$version" || { echo "tag $TAG does not match version $version" >&2; exit 1; }

      - name: Write checksums and notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          test "$(ls dist | wc -l)" -eq 13
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # The section of CHANGELOG.md for this version.
          awk -v heading="## ${TAG#v}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --draft --verify-tag --title "supaS3 ${TAG#v}" --notes-file notes.md dist/*
